[project]
name = "rag-expert-finder-eval-harness"
version = "0.1.0"
description = "RAG Expert-Finder eval harness: Promptfoo config generation, validated LLM judge, A/B and regression analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyalex==0.15.1",
    "numpy==2.1.3",
    "openai==1.54.4",
    "anthropic==0.39.0",
    "httpx==0.27.2",
]

[dependency-groups]
dev = [
    "pytest==8.3.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

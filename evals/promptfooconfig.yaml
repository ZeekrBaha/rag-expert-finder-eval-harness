# Verify provider/assertion syntax vs current Promptfoo docs before live runs.
description: RAG expert-finder eval — qualify the right PI, catch confident-wrong matches.

providers:
  - id: file://provider.py
    label: claude
    config: { model_provider: anthropic }
  - id: file://provider.py
    label: gpt-4o-mini
    config: { model_provider: openai }
  - id: file://provider.py
    label: deepseek
    config: { model_provider: deepseek }

defaultTest:
  assert:
    - type: llm-rubric
      # Judge is a different model from every candidate, but it shares vendor/family
      # with the gpt-4o-mini candidate (both GPT-4o). With only 3 vendor candidates
      # (anthropic, openai, deepseek) a fully out-of-family judge isn't available,
      # so residual family affinity is acknowledged and quantified via the bias probe
      # (evals/meta/bias_probe.py). Pinned for drift. JUDGE_MODEL is configurable to
      # point at a 4th-family judge if one is added.
      provider: openai:gpt-4o
      value: file://graders/judge_rubric.md

tests: file://tests.json
